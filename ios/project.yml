name: Centsio
options:
  bundleIdPrefix: com.centsio
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "RPM8V29G4A"
    CODE_SIGN_STYLE: Automatic

packages:
  # Plaid's own README recommends this lightweight repo (a pointer to the
  # precompiled XCFramework) over the main plaid-link-ios repo, which
  # downloads its full ~1GB git history under SPM. Verified against the
  # real repo/release/Package.swift at tag 7.1.0, not guessed.
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm.git
    from: 7.1.0

targets:
  Centsio:
    type: application
    platform: iOS
    sources:
      - path: Centsio
    dependencies:
      - package: LinkKit
        product: LinkKit
    info:
      path: Centsio/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Read by CentsioAPIClient; set per configuration below.
        CentsioAPIBaseURL: $(CENTSIO_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centsio.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        MARKETING_VERSION: "1.0"
        # Bump for every upload to App Store Connect; it rejects a repeat.
        CURRENT_PROJECT_VERSION: "4"
        # iPhone only for now: iPad needs its own layouts, orientations and screenshots.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Debug talks to a local uvicorn; Release (what Archive builds) to Render.
        Debug:
          CENTSIO_API_BASE_URL: http://localhost:8000
        Release:
          CENTSIO_API_BASE_URL: https://centsio-api.onrender.com
    entitlements:
      path: Centsio/Centsio.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    capabilities:
      - com.apple.developer.applesignin

  CentsioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CentsioTests
    dependencies:
      - target: Centsio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centsio.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Centsio:
    build:
      targets:
        Centsio: all
        CentsioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CentsioTests
