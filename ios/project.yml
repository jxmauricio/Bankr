name: Bankr
options:
  bundleIdPrefix: com.bankr
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  # Plaid's own README recommends this lightweight repo (a pointer to the
  # precompiled XCFramework) over the main plaid-link-ios repo, which
  # downloads its full ~1GB git history under SPM. Verified against the
  # real repo/release/Package.swift at tag 7.1.0, not guessed.
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm.git
    from: 7.1.0

targets:
  Bankr:
    type: application
    platform: iOS
    sources:
      - path: Bankr
    dependencies:
      - package: LinkKit
        product: LinkKit
    info:
      path: Bankr/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bankr.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
    entitlements:
      path: Bankr/Bankr.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    capabilities:
      - com.apple.developer.applesignin

  BankrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BankrTests
    dependencies:
      - target: Bankr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bankr.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Bankr:
    build:
      targets:
        Bankr: all
        BankrTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BankrTests
