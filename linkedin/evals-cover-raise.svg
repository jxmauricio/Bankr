<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="627" fill="#ede9fe"/>

  <!-- confetti -->
  <g opacity="0.9">
    <rect x="90" y="40" width="14" height="28" fill="#f43f5e" transform="rotate(25 97 54)"/>
    <rect x="1080" y="60" width="14" height="28" fill="#22c55e" transform="rotate(-30 1087 74)"/>
    <rect x="1010" y="470" width="14" height="28" fill="#f59e0b" transform="rotate(40 1017 484)"/>
    <rect x="60" y="430" width="14" height="28" fill="#3b82f6" transform="rotate(-20 67 444)"/>
    <circle cx="420" cy="40" r="8" fill="#f59e0b"/>
    <circle cx="1140" cy="300" r="8" fill="#f43f5e"/>
    <circle cx="30" cy="250" r="8" fill="#22c55e"/>
    <circle cx="760" cy="30" r="8" fill="#3b82f6"/>
  </g>

  <!-- user bubble -->
  <rect x="610" y="40" width="520" height="76" rx="26" fill="#2563eb"/>
  <text x="870" y="89" text-anchor="middle" fill="#fff" font-size="30">How much did I earn this month?</text>

  <!-- robot with party hat -->
  <polygon points="190,95 150,185 230,185" fill="#f43f5e" stroke="#1f2937" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="190" cy="92" r="12" fill="#f59e0b" stroke="#1f2937" stroke-width="5"/>
  <rect x="85" y="185" width="210" height="170" rx="34" fill="#cbd5e1" stroke="#1f2937" stroke-width="7"/>
  <circle cx="148" cy="255" r="22" fill="#fff" stroke="#1f2937" stroke-width="6"/>
  <circle cx="232" cy="255" r="22" fill="#fff" stroke="#1f2937" stroke-width="6"/>
  <circle cx="152" cy="258" r="9" fill="#1f2937"/>
  <circle cx="236" cy="258" r="9" fill="#1f2937"/>
  <path d="M135 305 Q190 350 245 305 Z" fill="#1f2937"/>
  <rect x="115" y="355" width="150" height="80" rx="18" fill="#94a3b8" stroke="#1f2937" stroke-width="7"/>
  <!-- arms up -->
  <line x1="85" y1="250" x2="40" y2="190" stroke="#1f2937" stroke-width="10" stroke-linecap="round"/>
  <line x1="295" y1="250" x2="340" y2="190" stroke="#1f2937" stroke-width="10" stroke-linecap="round"/>

  <!-- AI bubble -->
  <path d="M400 150 h700 a28 28 0 0 1 28 28 v245 a28 28 0 0 1 -28 28 h-700 a28 28 0 0 1 -28 -28 v-120 l-40 -25 l40 -10 v-90 a28 28 0 0 1 28 -28z" fill="#fff" stroke="#1f2937" stroke-width="6"/>
  <text x="430" y="215" fill="#7c3aed" font-size="44" font-weight="900">CONGRATS ON THE RAISE!! 🎉</text>
  <text x="430" y="280" fill="#1f2937" font-size="32">New income detected: <tspan fill="#16a34a" font-weight="800">+$40.00</tspan></text>
  <rect x="430" y="310" width="660" height="90" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="455" y="347" fill="#64748b" font-size="22">Source:</text>
  <text x="455" y="382" fill="#1f2937" font-size="28">Venmo from Alex — "my half of the pizza 🍕"</text>

  <!-- footer -->
  <rect x="0" y="500" width="1200" height="127" fill="#1f2937"/>
  <text x="600" y="553" text-anchor="middle" fill="#fde68a" font-size="34" font-weight="800">My AI thinks my friends paying me back is a career milestone.</text>
  <text x="600" y="600" text-anchor="middle" fill="#cbd5e1" font-size="28">This is why I write evals.</text>
</svg>
