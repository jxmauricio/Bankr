# Render Blueprint for the backend API. Single instance on purpose: the
# rate limiter in backend/app/rate_limit.py keeps its state in memory.
# Secrets are `sync: false` -- Render prompts for them on first deploy and
# they never live in this file.
# Free plan: sleeps after ~15 min idle (first request then takes ~1 min) and
# has no Shell tab. Switch to `starter` to keep it awake.
services:
  - type: web
    name: bankr-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    numInstances: 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_JWT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SIGNUP_INVITE_CODES
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        sync: false
      - key: PLAID_WEBHOOK_URL
        sync: false
      - key: PLAID_REDIRECT_URI
        sync: false
      - key: AGENT_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash-0731
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
